[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jy-polymarket-copy"
version = "0.1.0"
description = "Interactive CLI for Polymarket realtime copy trading deployment."
requires-python = ">=3.9"
readme = "README.md"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "py-clob-client-v2>=0.0.4",
]

[project.scripts]
jy = "polymarket_copy.cli:main"
jy-cli = "polymarket_copy.cli:main"
polymarket-copy-bot = "polymarket_copy.bot:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["polymarket_copy*"]
